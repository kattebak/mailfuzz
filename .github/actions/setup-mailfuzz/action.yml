name: "Setup Mailfuzz"
description: "Set up a complete mail testing environment with Dovecot IMAP, Postfix, and mailfuzz-generated emails"

inputs:
  config:
    description: "Path to a mailfuzz config file. When provided, the config is the source of truth and message-count/seed/plugin inputs are ignored."
    required: false
    default: ""
  test-user:
    description: "Username for the IMAP test account"
    required: false
    default: "testuser"
  test-password:
    description: "Password for the IMAP test account"
    required: false
    default: "testpass"
  message-count:
    description: "Number of messages to generate"
    required: false
    default: "50"
  seed:
    description: "Seed for deterministic generation"
    required: false
    default: "1984"
  install-mailfuzz:
    description: "Whether to install mailfuzz from npm (set to false if already installed in workspace)"
    required: false
    default: "true"

outputs:
  imap-host:
    description: "IMAP server hostname"
    value: "localhost"
  imap-port:
    description: "IMAP server port"
    value: "143"
  maildir-path:
    description: "Path to the generated Maildir"
    value: ${{ steps.generate.outputs.maildir-path }}
  message-count:
    description: "Actual number of messages generated"
    value: ${{ steps.generate.outputs.message-count }}

runs:
  using: "composite"
  steps:
    - name: Install system packages
      shell: bash
      run: |
        sudo debconf-set-selections <<< "postfix postfix/mailname string localhost"
        sudo debconf-set-selections <<< "postfix postfix/main_mailer_type string 'Local only'"
        sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq dovecot-core dovecot-imapd postfix

    - name: Stop services for configuration
      shell: bash
      run: |
        sudo systemctl stop dovecot 2>/dev/null || true
        sudo systemctl stop postfix 2>/dev/null || true

    - name: Create test user
      shell: bash
      run: |
        sudo useradd -m -s /bin/bash "${{ inputs.test-user }}" || true
        echo "${{ inputs.test-user }}:${{ inputs.test-password }}" | sudo chpasswd

    - name: Configure Dovecot and Postfix
      shell: bash
      env:
        TEST_USER: ${{ inputs.test-user }}
        TEST_PASS: ${{ inputs.test-password }}
      run: |
        sudo TEST_USER="${TEST_USER}" TEST_PASS="${TEST_PASS}" bash "${{ github.action_path }}/setup-dovecot.sh"

    - name: Install mailfuzz from npm
      if: inputs.install-mailfuzz == 'true'
      shell: bash
      run: |
        sudo npm install -g @kattebak/mailfuzz

    - name: Generate emails
      id: generate
      shell: bash
      run: |
        TEST_USER="${{ inputs.test-user }}"
        MAILDIR_PATH="/home/${TEST_USER}/Maildir"
        TEMP_MAILDIR=$(mktemp -d)

        CONFIG="${{ inputs.config }}"
        if [ -n "${CONFIG}" ]; then
          # Config file is the source of truth — only set output and recipient
          mailfuzz generate \
            --config "${CONFIG}" \
            --output "${TEMP_MAILDIR}" \
            --to "${TEST_USER}@localhost"
        else
          # No config file — use action inputs as CLI flags
          mailfuzz generate \
            --output "${TEMP_MAILDIR}" \
            --count "${{ inputs.message-count }}" \
            --seed "${{ inputs.seed }}" \
            --all-plugins \
            --to "${TEST_USER}@localhost"
        fi

        # Copy generated files into the test user's Maildir
        sudo find "${TEMP_MAILDIR}/cur" -type f -exec cp {} "${MAILDIR_PATH}/cur/" \;
        sudo find "${TEMP_MAILDIR}/new" -type f -exec cp {} "${MAILDIR_PATH}/new/" \;

        # Fix ownership so Dovecot can read the Maildir
        sudo chown -R "${TEST_USER}:${TEST_USER}" "${MAILDIR_PATH}"
        sudo chmod -R 700 "${MAILDIR_PATH}"

        # Count actual messages (Maildir files in cur/ and new/)
        ACTUAL_COUNT=$(sudo find "${MAILDIR_PATH}/cur" "${MAILDIR_PATH}/new" -type f 2>/dev/null | wc -l)
        echo "Generated ${ACTUAL_COUNT} messages in ${MAILDIR_PATH}"

        # Cleanup
        rm -rf "${TEMP_MAILDIR}"

        echo "maildir-path=${MAILDIR_PATH}" >> "$GITHUB_OUTPUT"
        echo "message-count=${ACTUAL_COUNT}" >> "$GITHUB_OUTPUT"

    - name: Start Dovecot
      shell: bash
      run: |
        sudo systemctl start dovecot
        sleep 2
        echo "Dovecot IMAP server started on port 143"

    - name: Start Postfix
      shell: bash
      run: |
        sudo systemctl start postfix
        sleep 1
        echo "Postfix started for local delivery"

    - name: Verify Dovecot authentication
      shell: bash
      run: |
        sudo doveadm auth test "${{ inputs.test-user }}" "${{ inputs.test-password }}"
        echo "Authentication verified successfully"
