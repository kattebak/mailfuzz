name: E2E Mail Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e-imap-test:
    name: End-to-end IMAP verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build mailfuzz
        run: npm run build

      - name: Install mailfuzz globally from local build
        run: sudo npm install -g .

      - name: Setup mail server and generate inbox
        uses: ./.github/actions/setup-mailfuzz
        id: mail-setup
        with:
          test-user: testuser
          test-password: testpass
          message-count: "50"
          seed: "1984"
          install-mailfuzz: "false"

      - name: Debug - show Dovecot logs on failure
        if: failure()
        run: |
          sudo cat /var/log/dovecot.log 2>/dev/null || true
          sudo cat /var/log/dovecot-info.log 2>/dev/null || true
          sudo journalctl -u dovecot --no-pager 2>/dev/null || true
          ls -la /home/testuser/Maildir/cur/ 2>/dev/null | head -20 || true
          ls -la /home/testuser/Maildir/new/ 2>/dev/null | head -20 || true

      - name: Verify IMAP server with generated emails
        uses: ./.github/actions/verify-imap
        with:
          username: testuser
          password: testpass
          expected-messages: "50"

      - name: Summary
        if: always()
        run: |
          echo "## E2E Mail Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Maildir path:** ${{ steps.mail-setup.outputs.maildir-path }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Messages generated:** ${{ steps.mail-setup.outputs.message-count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **IMAP server:** localhost:143" >> "$GITHUB_STEP_SUMMARY"
