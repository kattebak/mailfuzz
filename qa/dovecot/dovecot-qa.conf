# Mailfuzz QA Configuration for Dovecot 2.3
# Designed for local testing only

protocols = imap

log_path = /dev/stderr
auth_verbose = yes
mail_debug = yes

mail_location = maildir:/srv/mail/Maildir

ssl = no
listen = *

passdb {
  driver = static
  args = password=testpass
}

userdb {
  driver = static
  args = uid=vmail gid=vmail home=/srv/mail
}

service imap-login {
  inet_listener imap {
    port = 143
  }
}

auth_mechanisms = plain login
disable_plaintext_auth = no
first_valid_uid = 1000
